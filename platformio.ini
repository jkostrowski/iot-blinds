;	adafruit/Adafruit INA219@^1.2.1	


[platformio]
default_envs = COM

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	jandrassy/TelnetStream@^1.2.2

build_flags = 
	'-DWIFI_SSID="xxxx"'
	'-DWIFI_PASS="xxxx"'
	'-DMQTT_HOST="xxxx"'
	'-DMQTT_PORT=1883'
	'-DMQTT_USER="xxxx"'
	'-DMQTT_PASS="xxxx"'
	'-DMQTT_CLIENT="x2"'


[env:COM]
upload_protocol = esptool
upload_port = COM5
monitor_port = COM[2345]
monitor_speed = 115200

[env:OTA-x2]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="x2"'
upload_port = 192.168.7.160
monitor_port = socket://192.168.7.160:23

[env:OTA-blinds1]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds1"'
upload_port = 192.168.7.194  
monitor_port = socket://192.168.7.194:23

[env:OTA-blinds2]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds2"'
upload_port = 192.168.7.105
monitor_port = socket://192.168.7.105:23

[env:OTA-blinds3]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds3"'
upload_port = 192.168.7.107
monitor_port = socket://192.168.7.107:23

[env:OTA-blinds4]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds4"'
upload_port = 192.168.7.92
monitor_port = socket://192.168.7.92:23

