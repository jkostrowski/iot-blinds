[platformio]
default_envs = OTA

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = knolleary/PubSubClient@^2.8
build_flags = 
	'-DWIFI_SSID="xxxx"'
	'-DWIFI_PASS="xxxx"'
	'-DMQTT_HOST="xxxx"'
	'-DMQTT_PORT=1883'
	'-DMQTT_USER="xxxx"'
	'-DMQTT_PASS="xxxx"'
	'-DMQTT_CLIENT="xxxx"'

[env:COM]
upload_protocol = esptool
upload_port = COM5

[env:OTA]
upload_protocol = espota
upload_port = 192.168.7.194  ; blinds1

