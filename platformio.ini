[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	jandrassy/TelnetStream@^1.2.2
	adafruit/Adafruit INA219@^1.2.1	
extra_scripts = post:vault.py

[env:COM5 x2]
upload_protocol = esptool
upload_port = COM5
monitor_port = COM[2345]
monitor_speed = 115200
build_flags = 
	'-DMQTT_CLIENT="x2"'

[env:OTA x2]
upload_protocol = espota
upload_port = 192.168.7.160
monitor_port = socket://192.168.7.160:23
build_flags = 
	'-DMQTT_CLIENT="x2"'

[env:OTA blinds1 - Office]
upload_protocol = espota
upload_port = 192.168.7.87
monitor_port = socket://192.168.7.87:23
build_flags = 
	'-DMQTT_CLIENT="blinds1"'

[env:OTA blinds2 - Dining]
upload_protocol = espota
upload_port = 192.168.7.105
monitor_port = socket://192.168.7.105:23
build_flags = 
	'-DMQTT_CLIENT="blinds2"'

[env:OTA blinds3 - TV]  
upload_protocol = espota
upload_port = 192.168.7.107
monitor_port = socket://192.168.7.107:23
build_flags = 
	'-DMQTT_CLIENT="blinds3"'
	'-DREVERSE'

[env:OTA blinds4 - Yard]
upload_protocol = espota
upload_port = 192.168.7.92
monitor_port = socket://192.168.7.92:23
build_flags = 
	'-DMQTT_CLIENT="blinds4"'


