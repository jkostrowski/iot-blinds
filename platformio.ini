;	adafruit/Adafruit INA219@^1.2.1	


[platformio]
default_envs = COM

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	jandrassy/TelnetStream@^1.2.2

build_flags = 
	'-DWIFI_SSID="onosendai"'
	'-DWIFI_PASS="pajakjebiedronke"'
	'-DMQTT_HOST="192.168.254.11"'
	'-DMQTT_PORT=1883'
	'-DMQTT_USER="iot"'
	'-DMQTT_PASS="iot666"'

[env:COM]
upload_protocol = esptool
upload_port = COM5
monitor_port = COM[2345]
monitor_speed = 115200

;[env:OTAx2]
;upload_protocol = espota
;build_flags =  ${env.build_flags} '-DMQTT_CLIENT="x2"'
;upload_port = 192.168.254.20
;monitor_port = socket://192.168.254.20:23

[env:OTA1]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds1"'
upload_port = 192.168.254.21
monitor_port = socket://192.168.254.21:23

[env:OTA2]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds2"'
upload_port = 192.168.254.22
monitor_port = socket://192.168.254.22:23

[env:OTA3]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds3"' '-DREVERSE'
upload_port = 192.168.254.23
monitor_port = socket://192.168.254.23:23

[env:OTA4]
upload_protocol = espota
build_flags =  ${env.build_flags} '-DMQTT_CLIENT="blinds4"'
upload_port = 192.168.254.24
monitor_port = socket://192.168.254.24:23

