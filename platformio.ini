;	adafruit/Adafruit INA219@^1.2.1	


[platformio]
default_envs = COM
extra_configs = platformio.secret.ini

[esp]
platform = espressif8266
board = esp01_1m  ; nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	jandrassy/TelnetStream@^1.2.2


[env:COM]
extends = esp
upload_protocol = esptool
upload_port = COM4
monitor_port = COM[2345]
monitor_speed = 115200
build_flags = ${secret.build_flags} '-DMQTT_CLIENT="blinds2"'
  


[env:OTA1]
extends = esp
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds1"'
upload_port = 192.168.254.21
monitor_port = socket://192.168.254.21:23

[env:OTA2]
extends = esp
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds2"'
upload_port = 192.168.254.22
monitor_port = socket://192.168.254.22:23

[env:OTA3]
extends = esp
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds3"' '-DREVERSE'
upload_port = 192.168.254.93
monitor_port = socket://192.168.254.93:23

[env:OTA4]
extends = esp
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds4"'
upload_port = 192.168.254.94
monitor_port = socket://192.168.254.94:23

[env:OTA5]
extends = esp
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds5"'
upload_port = 192.168.254.95
monitor_port = socket://192.168.254.95:23


; old hardware: D1 mini, stepper on D5/D6/D7 (see OLD_HW in main.cpp)
[esp_old]
extends = esp
board = d1_mini

[env:OTA6]
extends = esp_old
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds6"' '-DOLD_HW'
upload_port = 192.168.254.96
monitor_port = socket://192.168.254.96:23

[env:OTA9]
extends = esp_old
upload_protocol = espota
build_flags =  ${secret.build_flags} '-DMQTT_CLIENT="blinds9"' '-DOLD_HW'
upload_port = 192.168.254.99
monitor_port = socket://192.168.254.99:23


[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags = -std=gnu++11

; pio run --list-targets
; pio run -e OTA3 -t upload
